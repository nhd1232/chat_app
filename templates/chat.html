<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ .Title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }

        h1, h2 {
            color: #000;
        }

        form {
            margin-bottom: 30px;
            padding: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }

        input, textarea, button {
            width: 100%;
            margin-top: 8px;
            margin-bottom: 16px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            cursor: pointer;
        }

        .message-list {
            margin-top: 20px;
        }

        .message {
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .author {
            font-weight: bold;
        }

        .meta {
            font-size: 14px;
            color: #666;
            white-space: nowrap;
        }

        .text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .empty {
            color: #777;
            font-style: italic;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }
    </style>
</head>
<body>
    <h1>{{ .Title }}</h1>

    <form action="/send" method="POST">
        <label for="username">Имя пользователя</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Введите имя"
            required
        >

        <label for="message">Сообщение</label>
        <textarea
            id="message"
            name="message"
            placeholder="Введите сообщение"
            required
        ></textarea>

        <button type="submit">Отправить</button>
    </form>

    <div class="message-list">
        <h2>Сообщения</h2>

        <div id="messages">
            {{ if .Messages }}
                {{ range .Messages }}
                    <div class="message">
                        <div class="message-header">
                            <div class="author">{{ .Author }}</div>
                            <div class="meta">{{ .Date }} {{ .Time }}</div>
                        </div>
                        <div class="text">{{ .Text }}</div>
                    </div>
                {{ end }}
            {{ else }}
                <p class="empty">Пока сообщений нет.</p>
            {{ end }}
        </div>
    </div>

    <script>
        const socket = new WebSocket("ws://localhost:8080/ws");

        socket.onopen = function() {
            console.log("WebSocket connected");
        };

        socket.onerror = function(error) {
            console.log("WebSocket error:", error);
        };

        socket.onmessage = function(event) {
            const messagesContainer = document.getElementById("messages");
            const emptyMessage = messagesContainer.querySelector(".empty");

            if (emptyMessage) {
                emptyMessage.remove();
            }

            const message = JSON.parse(event.data);

            const messageDiv = document.createElement("div");
            messageDiv.className = "message";

            const headerDiv = document.createElement("div");
            headerDiv.className = "message-header";

            const authorDiv = document.createElement("div");
            authorDiv.className = "author";
            authorDiv.textContent = message.author;

            const metaDiv = document.createElement("div");
            metaDiv.className = "meta";
            metaDiv.textContent = message.date + " " + message.time;

            const textDiv = document.createElement("div");
            textDiv.className = "text";
            textDiv.textContent = message.text;

            headerDiv.appendChild(authorDiv);
            headerDiv.appendChild(metaDiv);

            messageDiv.appendChild(headerDiv);
            messageDiv.appendChild(textDiv);

            messagesContainer.appendChild(messageDiv);
        };

        const form = document.querySelector("form");
        const usernameInput = document.getElementById("username");
        const messageInput = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const username = usernameInput.value.trim();
            const message = messageInput.value.trim();

            if (!username || !message) {
                return;
            }

            const payload = {
                author: username,
                text: message
            };

            const jsonMessage = JSON.stringify(payload);
            socket.send(jsonMessage);

            messageInput.value = "";
        });
    </script>
</body>
</html>
