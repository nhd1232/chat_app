<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ .Title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }

        h1, h2 {
            color: #000;
        }

        form {
            margin-bottom: 30px;
            padding: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }

        input, textarea, button {
            width: 100%;
            margin-top: 8px;
            margin-bottom: 16px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            cursor: pointer;
        }

        .message-list {
            margin-top: 20px;
        }

        .message {
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }

        .author {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .empty {
            color: #777;
            font-style: italic;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }
    </style>
</head>
<body>
    <h1>{{ .Title }}</h1>

    <form action="/send" method="POST">
        <label for="username">Имя пользователя</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Введите имя"
            required
        >

        <label for="message">Сообщение</label>
        <textarea
            id="message"
            name="message"
            placeholder="Введите сообщение"
            required
        ></textarea>

        <button type="submit">Отправить</button>
    </form>

    <div class="message-list">
        <h2>Сообщения</h2>

        {{ if .Messages }}
            {{ range .Messages }}
                <div class="message">
                    <div class="author">{{ .Author }}</div>
                    <div>{{ .Text }}</div>
                </div>
            {{ end }}
        {{ else }}
            <p class="empty">Пока сообщений нет.</p>
        {{ end }}
    </div>
    <script>
        const socket = new WebSocket("ws://localhost:8080/ws");

        socket.onopen = function() {
            console.log("WebSocket connected");
        };

        socket.onerror = function(error) {
            console.log("WebSocket error:", error);
        };

        const form = document.querySelector("form");
        const usernameInput = document.getElementById("username");
        const messageInput = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const username = usernameInput.value.trim();
            const message = messageInput.value.trim();

            if (!username || !message) {
                return;
            }

            const fullMessage = username + ": " + message;
            socket.send(fullMessage);

            messageInput.value = "";
        });
    </script>
</body>
</html>
